name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        name: Test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
                    - windows-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Set up minimum supported Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check formatting, lint, and types
              run: bun run check

            - name: Run full deterministic test suite
              run: bun run test

            - name: Build Node.js package from a clean state
              run: npm run build

            - name: Pack and test the exact tarball from an unrelated directory
              run: npm run test:package
